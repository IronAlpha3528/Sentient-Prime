# Sentinel-Prime Configuration

# --- SIEM ---
elasticsearch:
  host: "localhost"
  port: 9200
  index_prefix: "wazuh-"

# --- Honeypot ---
honeypots:
  # Bait files use dot-prefix to appear hidden on Linux
  # On Windows, set file attribute to hidden via attrib +H
  hidden_prefix: true
  adaptive:
    ttl_minutes: 30
    max_concurrent_entities: 5   # decoy budget (EXT-4)
  passive:
    # Paths registered at deployment time in honeytoken_registry.db

# --- Detection ---
detection:
  baseline_min_observations: 10  # min obs before trusting entity-level baseline
  zscore_threshold: 3.0          # standard deviations for anomaly flag
  entropy_threshold_low: 6.0     # below this = plaintext
  entropy_threshold_high: 7.5    # above this = likely encrypted

# --- Correlation ---
correlation:
  graph_window_minutes: 60       # sliding window for NetworkX graph
  ego_graph_hops: 2
  adaptive_trigger_low: 0.4      # score range for adaptive deception
  adaptive_trigger_high: 0.74

# --- Reasoning ---
reasoning:
  gemini_model: "gemini-2.0-flash"
  max_hypotheses: 4
  faiss_top_k: 5                 # top-k ATT&CK techniques per query

# --- Orchestration ---
orchestration:
  confidence_threshold: 0.75     # auto-execute if >= this AND low blast radius
  max_auto_blast_radius: 2       # max disrupted services for auto-execute
  dry_run_enabled: true

# --- Audit ---
audit:
  ledger_path: "data/audit_ledger.jsonl"
  hash_algorithm: "sha256"

# --- Verification ---
verification:
  delay_seconds: 2
  retry_count: 3
  retry_interval_seconds: 1
  max_duration_seconds: 10
  escalation_threshold: 0.8

# --- GraphRAG ---
graph_rag:
  traversal_depth: 2
  expansion_size: 5
  max_related_entities: 20
  enable_graph_expansion: true
  cache_size: 1000
  graph_file_path: "src/sentinel_prime/ai/agents/rag/index/attack_graph.pkl"
  enabled_providers: ["attack", "d3fend", "sigma", "yara", "cve", "kev", "playbook", "policy", "threat_report", "historical_incident"]
  provider_weights:
    attack: 1.0
    d3fend: 1.0
    sigma: 0.8
    yara: 0.8
    cve: 0.9
    kev: 0.9
    playbook: 1.0
    policy: 0.9
    threat_report: 0.8
    historical_incident: 1.0
  max_documents: 15
  per_provider_limit: 5
  cache_ttl_seconds: 300
  timeout_seconds: 3.0
  max_retrieved_incidents: 3
  similarity_threshold: 1.8
  storage_path: "src/sentinel_prime/ai/agents/rag/index/historical_incidents_db.json"
  enable_dense: true
  enable_bm25: true
  enable_hybrid: true
  rrf_k: 60
  dense_weight: 1.0
  bm25_weight: 0.8
  enable_reranking: true
  reranking_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  reranking_top_n: 15
  final_top_k: 5
  trust_weights:
    official_source: 1.0
    community_source: 0.8
    internal_knowledge: 0.95
    confidence_factor: 0.2
    completeness_factor: 0.1
  freshness_thresholds:
    fresh_max_days: 180
    stale_max_days: 365


