[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-prime"
version = "0.1.0"
description = "Agentic AI Cyber Resilience Platform — SIEM log analysis + honeypot deception layer + multi-hypothesis reasoning + risk-weighted containment"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Sentinel Team"},
]

dependencies = [
    # SIEM / Data
    "elasticsearch>=8.0,<9.0",
    "pandas>=2.0",
    "numpy>=1.24",

    # Graph correlation
    "networkx>=3.0",

    # LLM SDK (Gemini Flash)
    "google-generativeai>=0.8",

    # Web framework (webhook receiver + API backend)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",

    # ML models
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.0",

    # Vector DB (FAISS for ATT&CK RAG)
    "faiss-cpu>=1.7",
    "sentence-transformers>=3.0",

    # Data preprocessing
    "imbalanced-learn>=0.12",

    # Sigma rule engine
    "pySigma>=0.11",

    # OT/ICS testing
    "pymodbus>=3.5",

    # Config & utilities
    "pyyaml>=6.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
